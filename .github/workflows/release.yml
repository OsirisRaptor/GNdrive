name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    env:
      KSP_DIR: ${{ secrets.KSP_DIR }}
      KSP_DLL_DIR: ${{ secrets.KSP_DLL_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: nuget restore GNDrive.sln

      - name: Build Release
        run: msbuild GNDrive.sln /p:Configuration=Release

      - name: Prepare GameData
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item -Recurse GameData artifacts/GameData
          Remove-Item -Recurse -Force artifacts/GameData/GNDrive/Plugins/*.pdb -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts/GameData/GNDrive/Plugins/*.xml -ErrorAction SilentlyContinue

      - name: Zip Artifact
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: 'GNDrive_Rebuild_${{ github.ref_name }}.zip'
          directory: 'artifacts'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/GNDrive_Rebuild_${{ github.ref_name }}.zip
